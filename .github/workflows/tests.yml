# Prüfungen bei jedem Push und jeder Änderungsanfrage: Linter, Versionsnummer, Unit-Tests (ohne Browser) und Browser-Tests
# (Chromium, feste Testdaten) mit iPhone- und Android-Größe.
name: Tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Werkzeuge installieren
        run: |
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Linter
        run: npm run lint
      - name: Versionsnummer in index.html
        run: node tools/version.js --check
      - name: Unit-Tests
        run: npm run unit
      - name: Browser-Tests (iPhone)
        run: npm run e2e
      - name: Browser-Tests (Android)
        run: npm run e2e:android
